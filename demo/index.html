    <style>
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/serif.woff2") format("woff2"); font-style: normal; font-weight: 400; }
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/serif-italic.woff2") format("woff2"); font-style: italic; font-weight: 400; }
      @font-face { font-family: "Instrument Sans"; src: url("assets/fonts/sans.woff2") format("woff2"); font-style: normal; font-weight: 400 700; }
      :root {
        --ink: #f3eee4;
        --ember: #ff7a3d;
        --serif: "Instrument Serif", serif;
        --sans: "Instrument Sans", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; color: var(--ink); font-family: var(--sans); }
      /* a plain screen recording; the stage only gives a short float-in at the start and a float-out at the end */
      #stage { position: absolute; inset: 0; perspective: 2200px; }
      #screen { position: absolute; inset: 0; transform-origin: 50% 50%; overflow: hidden; }
      #screen video { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
      /* callout boxes: positions measured from the live page while recording (frame pixels) */
      .box { position: absolute; border: 3px solid var(--ember); border-radius: 8px; box-shadow: 0 0 22px rgba(255, 122, 61, 0.55); opacity: 0; }
      #dip { position: absolute; inset: 0; background: #000; opacity: 0; }
      .ch { position: absolute; left: 72px; bottom: 56px; display: flex; align-items: baseline; gap: 16px; padding: 12px 20px 12px 16px; border-radius: 6px; background: rgba(6, 6, 8, 0.82); border-left: 3px solid var(--ember); opacity: 0; white-space: nowrap; }
      .ch i { font-family: var(--serif); font-style: italic; font-size: 30px; color: var(--ember); }
      .ch span { font-family: var(--sans); font-weight: 600; font-size: 18px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--ink); }
    </style>

    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        function box(id, t0, t1) {
          tl.fromTo(id, { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, t0);
          tl.to(id, { opacity: 0, duration: 0.3, ease: "power1.in" }, t1);
        }
        function chapter(id, t0, t1) {
          tl.fromTo(id, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, t0);
          tl.to(id, { opacity: 0, duration: 0.35, ease: "power2.in" }, t1);
        }
        function dip(t) {
          tl.to("#dip", { opacity: 1, duration: 0.2, ease: "power2.in" }, t - 0.2);
          tl.to("#dip", { opacity: 0, duration: 0.3, ease: "power2.out" }, t);
        }

        // a short float-in to full screen, then a normal recording
        tl.fromTo("#screen", { rotationX: 10, scale: 0.88, y: 30 }, { rotationX: 0, scale: 1, y: 0, duration: 1.4, ease: "power3.out" }, 0);
        tl.fromTo("#screen", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out", immediateRender: false }, 0);

        chapter("#ch1", 0.8, 4.0);
        box("#b-outlook", 4.3, 7.4);  // switching on the early-warning layer
        box("#b-key", 7.6, 10.6);     // its legend: watch, above normal, season ahead
        box("#b-fires", 10.8, 14.8);  // today's fires off, then compare

        chapter("#ch2", 16.4, 18.8);
        box("#b-alert", 21.0, 22.2);  // "Alert created"
        dip(22.4);

        chapter("#ch3", 22.6, 25.4);
        dip(28.6);

        chapter("#ch4", 28.8, 31.4);
        box("#b-answer", 33.0, 36.1); // higher than 24 of the previous 26 Novembers
        dip(36.4);

        chapter("#ch5", 36.6, 39.4);
        // a short float-out, handing over to Act 4's globe
        tl.to("#screen", { rotationX: -8, scale: 0.9, opacity: 0, duration: 0.9, ease: "power2.in" }, 44.1);

        window.__timelines["main"] = tl;
      })();
