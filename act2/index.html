    <style>
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/serif.woff2") format("woff2"); font-style: normal; font-weight: 400; }
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/serif-italic.woff2") format("woff2"); font-style: italic; font-weight: 400; }

      :root {
        --bg: #000;

      /* shared type system, copied from act3 */

      .serif { font-family: var(--serif); font-weight: 400; letter-spacing: -0.01em; color: var(--ink); text-shadow: 0 6px 50px rgba(0, 0, 0, 0.6); white-space: nowrap; }
      .serif i { font-style: italic; }
      .mono { font-family: var(--mono); font-size: 15px; color: var(--dim); white-space: nowrap; }
      .scrim { position: absolute; inset: 0; pointer-events: none; }

      .scrim-b { background: linear-gradient(0deg, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0) 40%); }
      .rule { display: inline-block; width: 48px; height: 1px; background: var(--hair); vertical-align: middle; }
      .glass { background: rgba(8, 10, 14, 0.55); border: 1px solid rgba(243, 238, 228, 0.14); backdrop-filter: blur(16px); border-radius: 6px; }
