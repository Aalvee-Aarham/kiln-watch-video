<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s4-col { position: absolute; left: 112px; top: 160px; width: 760px; }
        #s4-modisWord { font-family: var(--serif); font-size: 130px; line-height: 1; color: var(--modis); }
        #s4-cdwrap { display: flex; align-items: baseline; gap: 26px; }
        #s4-cd { font-family: var(--mono); font-size: 150px; font-variant-numeric: tabular-nums; color: var(--alarm); text-shadow: 0 0 44px rgba(255, 74, 72, 0.5); }
        #s4-line { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
        #s4-titlewrap { position: absolute; left: 0; right: 0; top: 400px; text-align: center; }
        #s4-title { display: inline-block; font-family: var(--serif); font-size: 62px; line-height: 1.12; letter-spacing: 0.005em; color: var(--ink); max-width: 1680px; }
        #s4-sub { margin-top: 22px; font-family: var(--sans); font-weight: 500; font-size: 17px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--dim); }
        #s4-flash { position: absolute; inset: 0; background: #fff; pointer-events: none; }
      </style>
      <div id="s4-root" data-composition-id="s4-bridge" data-width="1920" data-height="1080" style="position:absolute;inset:0;overflow:hidden">
        <div id="s4-flash" style="opacity:0"></div>
        <div id="s4-col">
          <div id="s4-cdwrap"><span id="s4-modisWord">MODIS</span><span id="s4-cd">1</span></div>
        </div>
        <svg id="s4-line" viewBox="0 0 1920 1080"></svg>
        <div id="s4-titlewrap">
          <div class="serif" id="s4-title">HARMONIZATION OF MODIS AND VIIRS HOT SPOTS</div>
          <div id="s4-sub">NASA Space Apps Challenge 2026</div>
        </div>
      </div>
      <script>
        (function () {
          var K = window.KIT, tl = gsap.timeline({ paused: true });
          var svg = document.getElementById("s4-line");
          var X0 = 260, X1 = 1660, Y = 640, GAP0 = X0 + (9 / 21) * (X1 - X0), GAP1 = GAP0 + 62;
          var defs = K.svg("defs", {}, svg), f = K.svg("filter", { id: "s4-glow", x: "-200%", y: "-200%", width: "500%", height: "500%" }, defs);
          K.svg("feGaussianBlur", { stdDeviation: 6 }, f);
          K.svg("line", { id: "s4-modisLine", x1: X0, x2: GAP0, y1: Y, y2: Y, stroke: "#f2b862", "stroke-width": 4, "stroke-linecap": "round", opacity: 0 }, svg);
          K.svg("line", { id: "s4-viirsLine", x1: GAP1, x2: X1, y1: Y, y2: Y, stroke: "#8fbaff", "stroke-width": 4, "stroke-linecap": "round", opacity: 0 }, svg);
          var weld = K.svg("path", { id: "s4-weld", d: "M" + GAP0 + " " + Y + " Q " + ((GAP0 + GAP1) / 2) + " " + (Y - 46) + " " + GAP1 + " " + Y, fill: "none", stroke: "#ff7a3d", "stroke-width": 3.5, "stroke-linecap": "round" }, svg);
          var wl = GAP1 - GAP0 + 60;
          weld.setAttribute("stroke-dasharray", wl);
          weld.setAttribute("stroke-dashoffset", wl);
          var mark2012 = K.svg("circle", { id: "s4-mark2012", cx: 960, cy: 540, r: 5, fill: "#ff4a48", opacity: 0, filter: "url(#s4-glow)" }, svg);
          var cdEl = document.getElementById("s4-cd");

          K.drive(tl, 11, function (t) {
            cdEl.textContent = t < 0.3 ? "1" : "0";
            var pr = window.EARTH.project(t, 100, 16, 0.01);
            mark2012.setAttribute("cx", pr[0].toFixed(1));
            mark2012.setAttribute("cy", pr[1].toFixed(1));
            var glow = K.p(t, 5.0, 11.0);
            mark2012.setAttribute("opacity", (pr[2] * (0.25 + glow * 0.65)).toFixed(3));
            mark2012.setAttribute("r", (5 + glow * 5).toFixed(1));
          });

          // the zero-hit: digit flips, the record's MODIS half goes dark, the gap appears
          tl.fromTo("#s4-cd", { scale: 1.3 }, { scale: 1, duration: 0.14, ease: "power3.out" }, 0.3);
          tl.to("#s4-col", { opacity: 0, duration: 0.3, ease: "power1.in" }, 0.35);
          tl.fromTo(["#s4-modisLine", "#s4-viirsLine"], { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.3);
          tl.fromTo("#s4-flash", { opacity: 0 }, { opacity: 0.5, duration: 0.03 }, 0.3).to("#s4-flash", { opacity: 0, duration: 0.3, ease: "power2.out" }, 0.33);

          // 1 full second of true stillness (0.6 -> 1.6) — nothing else is scheduled in that window

          // the title types itself over the gap
          tl.fromTo("#s4-title", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 1.5, ease: "none" }, 1.6);
          tl.fromTo("#s4-sub", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 3.3);

          // the weld: a thin ember line arcs across the gap as the title lands — one deep hit
          tl.to("#s4-weld", { strokeDashoffset: 0, duration: 0.35, ease: "power2.inOut" }, 3.9);
          tl.fromTo("#s4-root", { x: 0 }, { x: 7, duration: 0.06, yoyo: true, repeat: 3, ease: "none" }, 4.15);
          tl.fromTo("#s4-flash", { opacity: 0 }, { opacity: 0.3, duration: 0.04, immediateRender: false }, 4.15).to("#s4-flash", { opacity: 0, duration: 0.45, ease: "power2.out" }, 4.19);

          // the title and the record line dissolve, leaving the bare globe and the glowing mark for the handoff to Act 3
          tl.to("#s4-titlewrap", { opacity: 0, duration: 1.0, ease: "power2.in" }, 6.2);
          tl.to(["#s4-modisLine", "#s4-viirsLine", "#s4-weld"], { opacity: 0, duration: 1.0, ease: "power2.in" }, 7.3);

          window.__timelines["s4-bridge"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
