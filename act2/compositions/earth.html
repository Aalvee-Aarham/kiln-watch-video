<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #earth-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      </style>
      <div id="earth-root" data-composition-id="earth" data-width="1920" data-height="1080" style="position:absolute;inset:0;overflow:hidden;background:#000">
        <canvas id="earth-cv" width="1920" height="1080" data-layout-allow-overflow></canvas>
      </div>
      <script>
        (function () {
          var cv = document.getElementById("earth-cv"), cur = 0;
          var tl = gsap.timeline({ paused: true });
          window.__hf = window.__hf || {};
          window.__hf.buildReady = window.__hf.buildReady || {};
          window.__hf.buildReady["earth-textures"] = window.EARTH.init(cv, "assets/tex/").then(function () { window.EARTH.render(cur); });
          window.KIT.drive(tl, 41, function (t) { cur = t; window.EARTH.render(t); });
          window.__timelines["earth"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
