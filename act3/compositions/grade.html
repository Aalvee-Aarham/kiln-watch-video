<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #gr-root { position: absolute; inset: 0; pointer-events: none; }
        #gr-vig { position: absolute; inset: 0; background: radial-gradient(120% 95% at 50% 48%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%); }
        #gr-grain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.09; mix-blend-mode: overlay; }
        .gr-bar { position: absolute; left: 0; right: 0; height: 104px; background: #000; }
        #gr-top { top: 0; transform-origin: 50% 0; }
        #gr-bot { bottom: 0; transform-origin: 50% 100%; }
        .gr-ch { position: absolute; left: 80px; bottom: 38px; display: flex; align-items: baseline; gap: 16px; opacity: 0; white-space: nowrap; }
        .gr-ch i { font-family: var(--serif); font-style: italic; font-size: 26px; color: var(--ember); }
        .gr-ch span { font-family: var(--sans); font-weight: 500; font-size: 15px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--dim); }
      </style>
      <div id="gr-root" data-composition-id="grade" data-width="1920" data-height="1080">
        <div id="gr-vig"></div>
        <canvas id="gr-grain" width="960" height="540"></canvas>
        <div class="gr-bar" id="gr-top"></div>
        <div class="gr-bar" id="gr-bot"></div>
        <div class="gr-ch" id="gr-c0"><i>01</i><span>The clue</span></div>
        <div class="gr-ch" id="gr-c1"><i>02</i><span>The fix</span></div>
        <div class="gr-ch" id="gr-c2"><i>03</i><span>The proof</span></div>
        <div class="gr-ch" id="gr-c3"><i>04</i><span>Crops</span></div>
        <div class="gr-ch" id="gr-c4"><i>05</i><span>Kilns</span></div>
        <div class="gr-ch" id="gr-c5"><i>06</i><span>Just ask</span></div>
      </div>
      <script>
        (function () {
          var K = window.KIT, tl = gsap.timeline({ paused: true });
          // grain: four seeded noise tiles, a new one every film frame (24 fps cadence), held during the freeze
          var cv = document.getElementById("gr-grain"), ctx = cv.getContext("2d"), tiles = [], rnd = K.rng(4242);
          for (var k = 0; k < 4; k++) {
            var c = document.createElement("canvas"); c.width = c.height = 256;
            var g = c.getContext("2d"), im = g.createImageData(256, 256);
            for (var i = 0; i < im.data.length; i += 4) { var v = (rnd() + rnd() + rnd()) * 85; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
            g.putImageData(im, 0, 0);
            tiles.push(ctx.createPattern(c, "repeat"));
          }
          K.drive(tl, 77, function (t) {
            var ft = t > 74.6 && t < 75.6 ? 74.6 : t, f = Math.floor(ft * 24);
            ctx.save();
            ctx.fillStyle = tiles[f % 4];
            ctx.translate(-((f * 73) % 256), -((f * 151) % 256));
            ctx.fillRect(0, 0, 960 + 256, 540 + 256);
            ctx.restore();
          });
          // letterbox in, and out again to hand the full frame to Act 4
          tl.fromTo(".gr-bar", { scaleY: 0 }, { scaleY: 1, duration: 1.0, ease: "power3.inOut" }, 0);
          tl.to(".gr-bar", { scaleY: 0, duration: 0.8, ease: "power3.inOut" }, 76.2);
          [[0, 10], [10, 25], [25, 38], [38, 47], [47, 58], [58, 77]].forEach(function (s, i) {
            tl.fromTo("#gr-c" + i, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, s[0] + 0.6);
            tl.to("#gr-c" + i, { opacity: 0, duration: 0.5, ease: "power1.in" }, s[1] - (i === 5 ? 1.2 : 0.5));
          });
          window.__timelines["grade"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
