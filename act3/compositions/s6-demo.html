            <div id="s6-mapP">
              <div id="s6-mapZ" data-layout-allow-overflow data-layout-allow-occlusion><div id="s6-img"></div><svg id="s6-map" viewBox="0 0 1060 734"></svg></div>

      <script>
        (function () {
          var K = window.KIT, G4 = window.GEO4;
          var tl = gsap.timeline({ paused: true });

          // ---- South Asia on a real Blue Marble crop: lon 65..100, top lat 35.5, 30.3 px/deg
          var PPD = 1060 / 35, mx = function (lon) { return (lon - 65) * PPD; }, my = function (lat) { return (35.5 - lat) * PPD; };
          var map = document.getElementById("s6-map");
          var bd = "";
          G4.countries.forEach(function (c) { c.rings.forEach(function (r) { for (var i = 0; i < r.length; i += 2) bd += (i ? "L" : "M") + mx(r[i]).toFixed(1) + " " + my(r[i + 1]).toFixed(1); bd += "Z"; }); });
          K.svg("path", { d: bd, fill: "none", stroke: "rgba(243,238,228,0.35)", "stroke-width": 1 }, map);
          var fg = K.svg("g", { fill: "#ff7a3d" }, map), F = G4.fires.ll, rnd = K.rng(31);
          for (var i = 0; i < F.length; i += 2) if (F[i] > 65 && F[i] < 100 && F[i + 1] > 9 && F[i + 1] < 36) K.svg("circle", { cx: mx(F[i]), cy: my(F[i + 1]), r: 2.2, opacity: 0.8 }, fg);
          for (var j = 0; j < 140; j++) K.svg("circle", { cx: mx(74.2 + rnd() * 2.6), cy: my(29.8 + rnd() * 2.4), r: 1.8, opacity: 0.85 }, fg); // Punjab stubble season
          var P = { x: mx(73.9), y: my(32.5), w: 3 * PPD, h: 3 * PPD }, per = 2 * (P.w + P.h);
          var box = K.svg("rect", { x: P.x, y: P.y, width: P.w, height: P.h, fill: "rgba(255,122,61,0.1)", stroke: "#ff7a3d", "stroke-width": 2, "stroke-dasharray": per, "stroke-dashoffset": per }, map);
          var boxLab = K.svg("text", { x: P.x, y: P.y - 10, "font-family": "Instrument Sans", "font-weight": 600, "font-size": 13, "letter-spacing": "3", fill: "#ffb08a", opacity: 0 }, map);
          boxLab.textContent = "PUNJAB, INDIA";
          var pcx = P.x + P.w / 2, pcy = P.y + P.h / 2, mapZ = document.getElementById("s6-mapZ");

          // ---- agent steps
          var steps = [["Draw area", "Punjab, India"], ["Fetch NASA FIRMS", "MODIS + VIIRS"], ["Harmonize", "both cameras, one record"], ["Compare with 23 years", "2003 – today"]];
          var stEl = document.getElementById("s6-steps"), stRows = [], cks = [];
          steps.forEach(function (s, i) {
            var r = document.createElement("div");
            r.className = "s6-st";
            r.innerHTML = '<div class="s6-ck">✓</div><div>' + s[0] + "<small>" + s[1] + "</small></div>";
            stEl.appendChild(r); stRows.push(r); cks.push(r.firstChild);
          });
          var STEP0 = 5.9, STEP = 0.62;

          // ---- answer chart: weeks 36..52, normal band vs this season
          var ch = document.getElementById("s6-chart");
          var defs = K.svg("defs", {}, ch), fl = K.svg("filter", { id: "s6-glow", x: "-20%", y: "-40%", width: "140%", height: "180%" }, defs);
          K.svg("feGaussianBlur", { stdDeviation: 4, result: "b" }, fl);
          var fm = K.svg("feMerge", {}, fl); K.svg("feMergeNode", { in: "b" }, fm); K.svg("feMergeNode", { in: "SourceGraphic" }, fm);
          var mean = [], hi = [], lo = [], now = [];
          for (var w = 0; w < 17; w++) {
            var m = 8 + 34 * Math.exp(-Math.pow((w - 9) / 3.2, 2));
            mean.push(m); hi.push(m * 1.35 + 3); lo.push(Math.max(1, m * 0.65 - 3));
            now.push(w < 5 ? m * (0.9 + 0.05 * w) : m * (1 + 1.15 * Math.exp(-Math.pow((w - 9.5) / 2.6, 2))));
          }
          var X0 = 30, X1 = 940, Y0 = 20, Y1 = 350, VMAX = 85;
          var xw = function (i) { return X0 + (i / 16) * (X1 - X0); }, yv = function (v) { return Y1 - (v / VMAX) * (Y1 - Y0); };
          var crit = K.svg("rect", { x: xw(7.5), y: Y0 - 10, width: xw(11.5) - xw(7.5), height: Y1 - Y0 + 10, fill: "#ff7a3d", opacity: 0 }, ch);
          var critL = K.svg("text", { x: xw(9.5), y: Y1 - 14, "text-anchor": "middle", "font-family": "Instrument Sans", "font-weight": 600, "font-size": 13, "letter-spacing": "3", fill: "#ffa77a", opacity: 0 }, ch);
          critL.textContent = "CRITICAL WEEKS";
          K.svg("line", { x1: X0, x2: X1, y1: Y1, y2: Y1, stroke: "rgba(243,238,228,0.2)", "stroke-width": 1 }, ch);
          [["SEP", 0], ["OCT", 4.3], ["NOV", 8.7], ["DEC", 13]].forEach(function (a) {
            var t = K.svg("text", { x: xw(a[1]), y: Y1 + 30, "font-family": "JetBrains Mono", "font-size": 14, fill: "rgba(243,238,228,0.5)" }, ch);
            t.textContent = a[0];
          });
          var band = K.svg("path", { d: "", fill: "#8fbaff", opacity: 0.2 }, ch);
          var bandL = K.svg("text", { x: xw(0.2), y: yv(hi[0]) - 14, "font-family": "Instrument Sans", "font-weight": 600, "font-size": 13, "letter-spacing": "3", fill: "#c6dcf5", opacity: 0 }, ch);
          bandL.textContent = "23-YEAR NORMAL";
          var line = K.svg("path", { d: "", fill: "none", stroke: "#ff7a3d", "stroke-width": 3.2, "stroke-linejoin": "round", "stroke-linecap": "round", filter: "url(#s6-glow)" }, ch);
          var odd = [];
          now.forEach(function (v, i) {
            if (v > hi[i]) {
              var g = K.svg("g", { opacity: 0 }, ch);
              K.svg("circle", { cx: xw(i), cy: yv(v), r: 16, fill: "#ff7a3d", opacity: 0.22 }, g);
              K.svg("circle", { cx: xw(i), cy: yv(v), r: 5, fill: "#ffd59a" }, g);
              odd.push({ g: g, i: i });
            }
          });
          var lineL = K.svg("text", { x: xw(12.5), y: yv(now[12]) - 28, "font-family": "Instrument Sans", "font-weight": 600, "font-size": 13, "letter-spacing": "3", fill: "#ff8d5c", opacity: 0 }, ch);
          lineL.textContent = "THIS SEASON";

          var ASK = "Is this fire season in Punjab, India unusual?", inText = document.getElementById("s6-intext");
          K.drive(tl, 19, function (t) {
            // typing 3.7 -> 5.0; cleared on send
            var n = Math.round(ASK.length * K.p(t, 3.7, 5.0));
            inText.textContent = t < 5.35 ? (t < 3.55 ? "" : ASK.slice(0, n) + (t % 0.5 < 0.25 ? "|" : "")) : "";
            stRows.forEach(function (r, i) {
              var on = t >= STEP0 + i * STEP;
              r.style.opacity = t >= STEP0 - 0.35 + i * STEP ? 1 : 0;
              cks[i].style.background = on ? "#ff7a3d" : "transparent";
              cks[i].style.borderColor = on ? "#ff7a3d" : "rgba(243,238,228,0.3)";
              cks[i].style.color = on ? "#120a05" : "transparent";
            });
            // box draws, map pushes toward Punjab
            box.setAttribute("stroke-dashoffset", (per * (1 - K.inOut(K.p(t, 5.9, 6.6)))).toFixed(1));
            boxLab.setAttribute("opacity", K.p(t, 6.5, 6.8));
            var z = K.inOut(K.p(t, 6.4, 8.0)), s = K.lerp(1, 2.1, z);
            mapZ.style.transform = "translate(" + K.lerp(0, 530 - pcx * s, z).toFixed(1) + "px," + K.lerp(0, 367 - pcy * s, z).toFixed(1) + "px) scale(" + s.toFixed(3) + ")";
            // rewind tracking band
            document.getElementById("s6-band").style.transform = "translateY(" + ((t * 1400) % 1200 - 120).toFixed(0) + "px)";
            // answer
            var bd2 = K.inOut(K.p(t, 8.8, 10.2)), nb = Math.max(2, Math.round(bd2 * 17)), up = [], dn = [];
            for (var i = 0; i < nb; i++) { up.push([xw(i), yv(hi[i])]); dn.unshift([xw(i), yv(lo[i])]); }
            band.setAttribute("d", bd2 > 0 ? K.line(up.concat(dn)) + "Z" : "");
            bandL.setAttribute("opacity", K.p(t, 10.0, 10.4));
            var ln = K.p(t, 10.0, 12.2), pts = [], nl = ln * 16;
            for (var j = 0; j <= Math.floor(nl); j++) pts.push([xw(j), yv(now[j])]);
            if (nl % 1 > 0 && Math.floor(nl) < 16) { var f = Math.floor(nl), fr = nl - f; pts.push([xw(f + fr), yv(K.lerp(now[f], now[f + 1], fr))]); }
            line.setAttribute("d", ln > 0 ? K.line(pts) : "");
            lineL.setAttribute("opacity", K.p(t, 12.2, 12.5));
            odd.forEach(function (o) {
              var at = 10.0 + (o.i / 16) * 2.2, ft = t > 16.6 && t < 17.6 ? 16.6 : t, pl = ft > at ? 0.75 + 0.25 * Math.cos((ft - at) * 6) : 0;
              o.g.setAttribute("opacity", K.p(t, at, at + 0.2) * pl);
            });
            crit.setAttribute("opacity", 0.12 * K.p(t, 12.4, 12.8));
            critL.setAttribute("opacity", K.p(t, 12.4, 12.8));
          });

          // ---- rewind (0 - 2.2)
          tl.fromTo("#s6-rw", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 0);
          tl.fromTo("#s6-q", { opacity: 0, x: -140, textShadow: "10px 0 rgba(255,74,72,0.8), -10px 0 rgba(143,186,255,0.8)" }, { opacity: 1, x: 0, textShadow: "0px 0 rgba(255,74,72,0), 0px 0 rgba(143,186,255,0)", duration: 0.9, ease: "steps(9)" }, 0);
          tl.fromTo("#s6-track", { opacity: 0.9 }, { opacity: 0, duration: 1.0, ease: "power1.in" }, 0);
          tl.fromTo("#s6-band", { opacity: 1 }, { opacity: 0, duration: 1.0, ease: "power1.in" }, 0);
          tl.fromTo("#s6-tc", { opacity: 1 }, { opacity: 0, duration: 0.3 }, 1.0);

          tl.to("#s6-rw", { opacity: 0, duration: 0.5 }, 2.3);
          tl.fromTo("#s6-win", { opacity: 0, y: 60, rotationY: -12, rotationX: 6, scale: 0.94 }, { opacity: 1, y: 0, rotationY: -5, rotationX: 2.5, scale: 1, duration: 1.0, ease: "power3.out" }, 2.4);
          tl.to("#s6-win", { rotationY: -1.5, rotationX: 0.8, duration: 13.2, ease: "none" }, 3.4); // slow push, stops at the freeze (16.6)
          tl.fromTo("#s6-plan", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.0);
          // cursor -> Send
          tl.fromTo("#s6-cur", { opacity: 0, x: 1560, y: 760 }, { opacity: 1, x: 1712, y: 870, duration: 0.6, ease: "power2.inOut" }, 4.6);
          tl.to("#s6-send", { scale: 0.88, duration: 0.08, yoyo: true, repeat: 1 }, 5.25);
          tl.to("#s6-cur", { opacity: 0, duration: 0.3 }, 5.7);
          tl.fromTo("#s6-msg", { opacity: 0, y: 24, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 5.35);
          tl.fromTo("#s6-tag", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 6.8);
          // ---- the answer (8.3 -> 19)
          tl.fromTo("#s6-ans", { opacity: 0, y: 70, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "expo.out" }, 8.3);
          tl.to("#s6-tag", { opacity: 0, duration: 0.3 }, 8.3);
          tl.fromTo("#s6-verdict", { opacity: 0, x: -24, filter: "blur(8px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 13.0);
          tl.fromTo("#s6-src", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 13.6);
          tl.fromTo("#s6-flip", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power4.in" }, 15.4);

          tl.to("#s6-win", { scale: 0.93, y: 20, duration: 1.4, ease: "power2.in" }, 17.6);
          tl.to("#s6-root", { opacity: 0, duration: 0.3 }, 18.7);

        })();
      </script>
